[package]
name = "obsidian-vpn"
version = "1.1.1"
description = "ObsidianVPN desktop client"
authors = ["ObsidianVPN"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
data-encoding = "2"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
qrcode = "0.14"
russh = "0.52"
russh-sftp = "2"
tokio = { version = "1", features = ["time", "net", "io-util", "rt-multi-thread"] }
arboard = "3"
