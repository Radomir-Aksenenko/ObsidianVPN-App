name: iOS

# Called by release.yml on pushes to main and tags. Runs on its own for PRs and manual dispatch.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - "core"
      - "core/**"
      - "scripts/set-version.mjs"
      - "VERSION"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA (device arm64)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Show toolchain versions
        run: |
          go version
          xcodebuild -version
          swift --version

      - name: Test mobile package
        working-directory: core
        run: go test ./pkg/mobile

      - name: Install gomobile, gobind and XcodeGen
        working-directory: core
        run: |
          # Pin to the golang.org/x/mobile version already required by core/go.mod.
          MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          brew install xcodegen

      - name: Build Go Mobile XCFramework
        working-directory: core
        run: |
          mkdir -p ../ios/Frameworks
          gomobile bind \
            -target=ios,iossimulator \
            -o ../ios/Frameworks/Obsidian.xcframework \
            ./pkg/mobile

      - name: Stamp version and build number
        run: node scripts/set-version.mjs "${{ github.run_number }}"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ObsidianVPN.xcodeproj \
            -scheme ObsidianVPN \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/ObsidianDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/ios-build.log"

      - name: Package IPA
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          APP="$RUNNER_TEMP/ObsidianDerivedData/Build/Products/Release-iphoneos/ObsidianVPN.app"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/dist/ObsidianVPN-${VERSION}.ipa" Payload)
          ls -l dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
