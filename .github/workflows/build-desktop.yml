name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch core binaries
        shell: pwsh
        run: ./scripts/fetch-core.ps1

      - name: Install JS dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-vpn-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    # Keeps a rolling "desktop-latest" pre-release with the installer built from main.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obsidian-vpn-windows
          path: dist

      - name: Update desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-latest
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Desktop (latest main)" \
              --notes "Rolling build of the desktop app from the main branch."
          fi
          gh release upload "$TAG" dist/*.exe --clobber
