name: Desktop

# Called by release.yml on pushes to main and tags. Runs on its own for PRs and manual dispatch.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "core"
      - "core/**"
      - "scripts/**"
      - "VERSION"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build obsidian-client.exe (windows/amd64)
        working-directory: core
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o ../desktop/src-tauri/resources/obsidian-client.exe ./cmd/client

      - name: Build obsidian-server-linux (linux/amd64)
        working-directory: core
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o ../desktop/src-tauri/resources/obsidian-server-linux ./cmd/server

      - name: Fetch wintun.dll (pinned, SHA256 verified)
        run: ./scripts/fetch-wintun.ps1 -Destination desktop/src-tauri/resources/wintun.dll

      - name: Stamp version
        run: node scripts/set-version.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build Tauri installer
        working-directory: desktop
        run: npx tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
