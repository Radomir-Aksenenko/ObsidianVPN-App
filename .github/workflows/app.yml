name: App

# Flutter app in app/ (Android, iOS, macOS, Linux, Windows) with the Go core in core/.
# check:   pub get, gen-l10n, strict analyze (any info, warning or error fails), flutter test.
# assets:  scripts/build-core-assets.sh, shared as the core-assets artifact (app/assets/bin).
# android: gomobile AAR, release APKs per ABI and an AAB (release signing uses the keystore secrets when present, otherwise debug).
# ios:     gomobile xcframework, PacketTunnel target patch, unsigned IPA.
# macos:   universal darwin client, .app zipped with ditto.   linux: tar.gz.
# windows: zip and Inno Setup installer (app/windows/installer/obsidian.iss).
# version:  VERSION (repo root) is read into APP_VERSION on each platform job and passed to flutter build.
# Every platform job needs "assets".
# Called by release.yml (workflow_call) for main and v* tags, so main is not a push trigger here.

on:
  workflow_call:
  push:
    branches:
      - feat/flutter-app
    paths:
      - "app/**"
      - "core"
      - "scripts/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "core"
      - "scripts/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

# When called, github.workflow is the caller's name ("Release"), so called runs never share a group with standalone runs.
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  # r28 or newer defaults to 16 KB max page size, which Play needs for targetSdk 35+ on new devices.
  NDK_VERSION: "28.2.13676358"

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch packages and generate l10n
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze (fails on infos, warnings and errors)
        working-directory: app
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test

  assets:
    name: Core assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build desktop clients and Linux servers
        run: bash scripts/build-core-assets.sh

      - name: Show assets
        run: ls -l app/assets/bin

      - name: Upload core assets
        uses: actions/upload-artifact@v4
        with:
          name: core-assets
          path: app/assets/bin/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          # Preinstalled toolchains the Android build does not use. /usr/local/lib/android (SDK/NDK) is kept.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune --all --force || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION_VALUE"
          echo "APP_VERSION=$VERSION_VALUE" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install gomobile and gobind
        working-directory: core
        run: |
          set -euo pipefail
          # Pin to the golang.org/x/mobile version already required by core/go.mod.
          MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Bind Go core to AAR
        working-directory: core
        run: |
          set -euo pipefail
          mkdir -p ../app/android/app/libs
          gomobile bind \
            -target=android \
            -androidapi 24 \
            -ldflags="-extldflags=-Wl,-z,max-page-size=16384" \
            -javapkg=com.obsidian.core \
            -o ../app/android/app/libs/obsidian.aar \
            ./pkg/mobile

      - name: Download core assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          path: app/assets/bin

      - name: Keep only the core assets this platform uses
        run: |
          set -euo pipefail
          keep=" obsidian-server-linux-amd64 obsidian-server-linux-arm64 keyserver.py .gitkeep "
          for f in app/assets/bin/* app/assets/bin/.[!.]*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$keep" in
              *" $name "*) ;;
              *) rm -rf "$f" ;;
            esac
          done
          ls -la app/assets/bin

      - name: Fetch packages and generate l10n
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Empty secret: no path is output, so Gradle keeps the debug signing key.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set: release builds use debug signing."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (per ABI)
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION

      - name: Build release App Bundle
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS
    needs: assets
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION_VALUE"
          echo "APP_VERSION=$VERSION_VALUE" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install gomobile and gobind
        working-directory: core
        run: |
          set -euo pipefail
          # Pin to the golang.org/x/mobile version already required by core/go.mod.
          MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Bind Go core to XCFramework
        working-directory: core
        run: |
          set -euo pipefail
          mkdir -p ../app/ios/Frameworks
          gomobile bind \
            -target=ios,iossimulator \
            -o ../app/ios/Frameworks/Obsidian.xcframework \
            ./pkg/mobile

      - name: Download core assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          path: app/assets/bin

      - name: Keep only the core assets this platform uses
        run: |
          set -euo pipefail
          keep=" obsidian-server-linux-amd64 obsidian-server-linux-arm64 keyserver.py .gitkeep "
          for f in app/assets/bin/* app/assets/bin/.[!.]*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$keep" in
              *" $name "*) ;;
              *) rm -rf "$f" ;;
            esac
          done
          ls -la app/assets/bin

      - name: Fetch packages and generate l10n
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Add PacketTunnel target to Xcode project
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby app/scripts/ios_add_packet_tunnel.rb

      - name: Build unsigned iOS app
        working-directory: app
        run: flutter build ios --release --no-codesign --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD" dist
          cp -R app/build/ios/iphoneos/Runner.app "$PAYLOAD/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/dist/obsidian-unsigned.ipa" Payload)
          ls -l dist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/obsidian-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    needs: assets
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION_VALUE"
          echo "APP_VERSION=$VERSION_VALUE" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download core assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          path: app/assets/bin

      - name: Keep only the core assets this platform uses
        run: |
          set -euo pipefail
          keep=" obsidian-server-linux-amd64 obsidian-server-linux-arm64 keyserver.py .gitkeep obsidian-client-darwin-universal "
          for f in app/assets/bin/* app/assets/bin/.[!.]*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$keep" in
              *" $name "*) ;;
              *) rm -rf "$f" ;;
            esac
          done
          ls -la app/assets/bin

      - name: Build darwin universal client if missing
        run: |
          set -euo pipefail
          # The assets job runs on Linux, where lipo is absent, so the universal binary
          # is normally missing. Rebuild the assets here, where lipo exists.
          if [ ! -f app/assets/bin/obsidian-client-darwin-universal ]; then
            bash scripts/build-core-assets.sh
          fi
          test -f app/assets/bin/obsidian-client-darwin-universal

      - name: Fetch packages and generate l10n
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build release macOS app
        working-directory: app
        run: flutter build macos --release --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION

      - name: Zip .app
        run: |
          set -euo pipefail
          APP=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/obsidian-macos.zip
          ls -l dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/obsidian-macos.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION_VALUE"
          echo "APP_VERSION=$VERSION_VALUE" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev

      - name: Download core assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          path: app/assets/bin

      - name: Keep only the core assets this platform uses
        run: |
          set -euo pipefail
          keep=" obsidian-server-linux-amd64 obsidian-server-linux-arm64 keyserver.py .gitkeep obsidian-client-linux-amd64 "
          for f in app/assets/bin/* app/assets/bin/.[!.]*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$keep" in
              *" $name "*) ;;
              *) rm -rf "$f" ;;
            esac
          done
          ls -la app/assets/bin

      - name: Fetch packages and generate l10n
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build release Linux bundle
        working-directory: app
        run: flutter build linux --release --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION

      - name: Package tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C app/build/linux/x64/release/bundle -czf dist/obsidian-linux-x64.tar.gz .
          ls -l dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/obsidian-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    needs: assets
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION_VALUE"
          echo "APP_VERSION=$VERSION_VALUE" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download core assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          path: app/assets/bin

      - name: Keep only the core assets this platform uses
        shell: bash
        run: |
          set -euo pipefail
          keep=" obsidian-server-linux-amd64 obsidian-server-linux-arm64 keyserver.py .gitkeep obsidian-client-windows-amd64.exe wintun.dll "
          for f in app/assets/bin/* app/assets/bin/.[!.]*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$keep" in
              *" $name "*) ;;
              *) rm -rf "$f" ;;
            esac
          done
          ls -la app/assets/bin

      - name: Fetch packages and generate l10n
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build release Windows app
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release "--build-name=$env:APP_VERSION" --build-number=${{ github.run_number }} "--dart-define=APP_VERSION=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "flutter build failed with exit code $LASTEXITCODE" }

      - name: Zip Release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'app/build/windows/x64/runner/Release/*' -DestinationPath 'dist/obsidian-windows-x64.zip' -Force
          Get-ChildItem dist

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DOutputName=obsidian-windows-x64-setup" "/DOutputDirPath=$env:GITHUB_WORKSPACE\dist" app\windows\installer\obsidian.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/obsidian-windows-x64.zip
            dist/obsidian-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
