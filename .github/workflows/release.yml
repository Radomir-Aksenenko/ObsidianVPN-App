name: Release

# Pushes to main publish the rolling "nightly" prerelease.
# Pushes of a v* tag publish a versioned GitHub Release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: iOS
    uses: ./.github/workflows/ios.yml

  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml

  publish:
    name: Publish
    needs: [ios, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Show assets
        run: ls -l dist

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${VERSION})" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "Obsidian VPN ${VERSION}" \
              --generate-notes
          fi

      - name: Update nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          NOTES="Rolling build of main at ${GITHUB_SHA:0:7}, version ${VERSION}. Built automatically, not for production use."

          # Point the nightly tag at this commit so the release follows main.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly ${VERSION}" --notes "$NOTES" --prerelease
          else
            gh release create nightly --prerelease --title "Nightly ${VERSION}" --notes "$NOTES"
          fi

          # Drop the previous build's assets, then upload the new ones.
          while IFS= read -r asset; do
            [ -n "$asset" ] && gh release delete-asset nightly "$asset" --yes
          done < <(gh release view nightly --json assets --jq '.assets[].name')
          gh release upload nightly dist/* --clobber
