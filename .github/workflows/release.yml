name: Release

# Pushes to main publish the rolling "nightly" prerelease.
# Pushes of a v* tag publish a versioned GitHub Release.
# Assets: old client (ios, desktop) and the Flutter app (app.yml, copied to dist/ as Obsidian-<VERSION>-*).
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: iOS
    uses: ./.github/workflows/ios.yml

  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml

  app:
    name: App
    uses: ./.github/workflows/app.yml
    secrets: inherit

  publish:
    name: Publish
    needs: [ios, desktop, app]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download app Android build
        uses: actions/download-artifact@v4
        with:
          name: android
          path: app-dist/android

      - name: Download app iOS build
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: app-dist/ios

      - name: Download app macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: app-dist/macos

      - name: Download app Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: app-dist/linux

      - name: Download app Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: app-dist/windows

      - name: Copy app builds into dist with versioned names
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Find each expected file under app-dist (artifact layout may keep sub-paths); fail if any is missing.
          copy_app_file() {
            local src
            src=$(find app-dist -type f -name "$1" | head -n 1)
            if [ -z "$src" ]; then
              echo "Missing app build file: $1" >&2
              exit 1
            fi
            cp "$src" "dist/$2"
          }
          copy_app_file app-arm64-v8a-release.apk "Obsidian-${VERSION}-android-arm64-v8a.apk"
          copy_app_file app-armeabi-v7a-release.apk "Obsidian-${VERSION}-android-armeabi-v7a.apk"
          copy_app_file app-x86_64-release.apk "Obsidian-${VERSION}-android-x86_64.apk"
          copy_app_file app-release.aab "Obsidian-${VERSION}-android.aab"
          copy_app_file obsidian-unsigned.ipa "Obsidian-${VERSION}-ios-unsigned.ipa"
          copy_app_file obsidian-macos.zip "Obsidian-${VERSION}-macos.zip"
          copy_app_file obsidian-linux-x64.tar.gz "Obsidian-${VERSION}-linux-x64.tar.gz"
          copy_app_file obsidian-windows-x64.zip "Obsidian-${VERSION}-windows-x64.zip"

      - name: Show assets
        run: ls -l dist

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${VERSION})" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "Obsidian VPN ${VERSION}" \
              --generate-notes
          fi

      - name: Update nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          NOTES="Rolling build of main at ${GITHUB_SHA:0:7}, version ${VERSION}. Built automatically, not for production use."

          # Point the nightly tag at this commit so the release follows main.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly ${VERSION}" --notes "$NOTES" --prerelease
          else
            gh release create nightly --prerelease --title "Nightly ${VERSION}" --notes "$NOTES"
          fi

          # Drop the previous build's assets, then upload the new ones.
          while IFS= read -r asset; do
            [ -n "$asset" ] && gh release delete-asset nightly "$asset" --yes
          done < <(gh release view nightly --json assets --jq '.assets[].name')
          gh release upload nightly dist/* --clobber
